<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Franchise Adzopé — Suivi Commercial</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="loginRoot"></div>

<div id="appRoot" class="app-shell" hidden>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="assets/logo.jpg" alt="OmnySyncBase" class="sidebar-logo">
      <div>
        <div class="sidebar-title" id="brandTitle">TEAM FRANCHISE ADZOPÉ</div>
        <div class="sidebar-sub">OmnySyncBase</div>
      </div>
    </div>
    <nav class="sidenav" id="tabs">
      <button class="tab side-link active" data-tab="dashboard">
        <svg viewBox="0 0 24 24" class="side-icon"><path d="M12 3 2 11h3v9h6v-6h2v6h6v-9h3Z"/></svg>
        Tableau de bord
      </button>
      <button class="tab side-link" data-tab="bilan">
        <svg viewBox="0 0 24 24" class="side-icon"><path d="M3 13h8V3H3v10Zm0 8h8v-6H3v6Zm10 0h8V11h-8v10Zm0-18v6h8V3h-8Z"/></svg>
        Bilan des activités
      </button>

      <div class="side-group" data-group="objectifs">
        <button class="side-group-toggle">
          <svg viewBox="0 0 24 24" class="side-icon"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm0 16a6 6 0 1 1 6-6 6 6 0 0 1-6 6Zm0-9a3 3 0 1 0 3 3 3 3 0 0 0-3-3Z"/></svg>
          <span>Objectifs</span>
          <svg viewBox="0 0 24 24" class="side-chevron"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
        <div class="side-group-items">
          <button class="tab side-link side-sublink" data-tab="objectifs-suivi">
            <svg viewBox="0 0 24 24" class="side-icon"><path d="M3 13h8V3H3v10Zm0 8h8v-6H3v6Zm10 0h8V11h-8v10Zm0-18v6h8V3h-8Z"/></svg>
            Suivi du mois
          </button>
          <button class="tab side-link side-sublink" data-tab="objectifs-historique">
            <svg viewBox="0 0 24 24" class="side-icon"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm1 10.6 4.2 2.5-.8 1.3-5-3V6h1.6Z"/></svg>
            Historique des objectifs
          </button>
          <button class="tab side-link side-sublink" data-tab="objectifs-evaluation">
            <svg viewBox="0 0 24 24" class="side-icon"><path d="m12 2 2.9 6.3 6.9.7-5.2 4.7 1.5 6.8L12 17.1 5.9 20.5l1.5-6.8L2.2 9l6.9-.7Z"/></svg>
            Évaluation des vendeurs
          </button>
          <button class="tab side-link side-sublink" data-tab="objectifs-outlets">
            <svg viewBox="0 0 24 24" class="side-icon"><path d="M4 4h16l1.5 5a2.5 2.5 0 0 1-2.5 2.5h-.2A2.5 2.5 0 0 1 16.5 9 2.5 2.5 0 0 1 14 11.5 2.5 2.5 0 0 1 11.5 9 2.5 2.5 0 0 1 9 11.5 2.5 2.5 0 0 1 6.5 9h-.2A2.5 2.5 0 0 1 2.5 11.5v-1L4 4Zm1 8.9c.7.4 1.5.6 2.3.6.9 0 1.8-.3 2.5-.7.7.4 1.6.7 2.5.7s1.8-.3 2.5-.7c.7.4 1.6.7 2.5.7.8 0 1.6-.2 2.2-.6V20H5v-7.1Z"/></svg>
            Fréquentation &amp; Client mystère
          </button>
        </div>
      </div>

      <button class="tab side-link" data-tab="abonnements">
        <svg viewBox="0 0 24 24" class="side-icon"><path d="M4 8a8 8 0 0 1 16 0h-2a6 6 0 0 0-12 0Zm3 0a5 5 0 0 1 10 0h-2a3 3 0 0 0-6 0Zm2 0a3 3 0 0 1 6 0h-2a1 1 0 0 0-2 0Z"/><circle cx="12" cy="17" r="2"/></svg>
        Abonnements 4G Home
      </button>

      <div class="side-group" data-group="equipe">
        <button class="side-group-toggle">
          <svg viewBox="0 0 24 24" class="side-icon"><path d="M16 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm-8 0a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-2.7 0-8 1.3-8 4v3h10v-3c0-1.2.5-2.2 1.3-3.1A13.4 13.4 0 0 0 8 13Zm8 0c-.6 0-1.3 0-2 .1.9.9 1.5 2 1.5 3.4v3.5h8.5v-3c0-2.7-5.3-4-8-4Z"/></svg>
          <span>Équipe &amp; Points de vente</span>
          <svg viewBox="0 0 24 24" class="side-chevron"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
        <div class="side-group-items">
          <button class="tab side-link side-sublink" data-tab="equipe-vendeurs">
            <svg viewBox="0 0 24 24" class="side-icon"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4 0-9 1.7-9 5v3h18v-3c0-3.3-5-5-9-5Z"/></svg>
            Vendeurs
          </button>
          <button class="tab side-link side-sublink" data-tab="equipe-points">
            <svg viewBox="0 0 24 24" class="side-icon"><path d="M4 4h16l1.5 5a2.5 2.5 0 0 1-2.5 2.5h-.2A2.5 2.5 0 0 1 16.5 9 2.5 2.5 0 0 1 14 11.5 2.5 2.5 0 0 1 11.5 9 2.5 2.5 0 0 1 9 11.5 2.5 2.5 0 0 1 6.5 9h-.2A2.5 2.5 0 0 1 2.5 11.5v-1L4 4Zm1 8.9c.7.4 1.5.6 2.3.6.9 0 1.8-.3 2.5-.7.7.4 1.6.7 2.5.7s1.8-.3 2.5-.7c.7.4 1.6.7 2.5.7.8 0 1.6-.2 2.2-.6V20H5v-7.1Z"/></svg>
            Points de vente
          </button>
        </div>
      </div>

      <button class="tab side-link" data-tab="export">
        <svg viewBox="0 0 24 24" class="side-icon"><path d="M5 20h14v-2H5Zm7-16-5.5 5.5 1.4 1.4L11 8.8V17h2V8.8l3.1 3.1 1.4-1.4Z"/></svg>
        Export / Sauvegarde
      </button>

      <button class="tab side-link side-bottom" data-tab="parametres">
        <svg viewBox="0 0 24 24" class="side-icon"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L14.9 3H9.1l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4L4.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1L9.1 21h5.7l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4Zm-7.4 2.5a3.5 3.5 0 1 1 3.5-3.5 3.5 3.5 0 0 1-3.5 3.5Z"/></svg>
        Paramètres
      </button>
    </nav>
  </aside>

  <div class="main-col">
    <header class="topheader">
      <div></div>
      <div class="user-chip" id="userChip">
        <span class="user-avatar" id="userAvatar">A</span>
        <div>
          <div class="user-name" id="userName">Administrateur</div>
          <div class="user-role" id="userRole">Compte principal</div>
        </div>
        <button class="btn btn-sm" id="btnLogout">Se déconnecter</button>
      </div>
    </header>

    <main id="view"></main>

    <footer class="footer">
      Données enregistrées localement dans ce navigateur — pensez à exporter une sauvegarde régulièrement (onglet Export / Sauvegarde).
      <br>OmnySyncBase — Le tout-en-un pour gérer votre entreprise
    </footer>
  </div>
</div>

<div id="modalRoot"></div>

<script src="vendor/xlsx.full.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
